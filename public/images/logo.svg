<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="100%">
  <!-- PRECISION LIFE SCIENCES - MASTER VECTOR LOGO (EDITABLE) -->
  <!-- Colors: Deep Navy #00205B, Cyan Blue #00A3E0, Background: Transparent -->

  <!-- ICON MARK: P L S -->
  <g id="PLS_Emblem" transform="translate(45, 34)">
    <!-- ================= LETTER 'P' (Deep Navy) ================= -->
    <g id="Letter_P" fill="#00205B">
      <!-- Row 1: Top Bar -->
      <rect x="0" y="0" width="64" height="13.5" rx="6.75"/>
      <!-- Row 2: Middle Bar -->
      <rect x="0" y="24" width="64" height="13.5" rx="6.75"/>
      <!-- Row 3: Lower Loop Bar -->
      <rect x="0" y="48" width="64" height="13.5" rx="6.75"/>
      <!-- Row 4: Stem Base (Dot) -->
      <circle cx="6.75" cy="78.75" r="6.75"/>
    </g>

    <!-- ================= LETTER 'L' (Light Cyan/Sky Blue) ================= -->
    <g id="Letter_L" fill="#00A3E0">
      <!-- Row 1: Top Dot -->
      <rect x="76" y="0" width="13.5" height="13.5" rx="6.75"/>
      <!-- Row 2: Middle Dot -->
      <rect x="76" y="24" width="13.5" height="13.5" rx="6.75"/>
      <!-- Row 3: Lower Dot -->
      <rect x="76" y="48" width="13.5" height="13.5" rx="6.75"/>
      <!-- Row 4: Horizontal Foot Bar extending to the right -->
      <rect x="76" y="72" width="64" height="13.5" rx="6.75"/>
    </g>

    <!-- ================= LETTER 'S' (Deep Navy) ================= -->
    <g id="Letter_S" fill="#00205B">
      <!-- Row 1: Top Bar of S -->
      <rect x="152" y="0" width="64" height="13.5" rx="6.75"/>
      <!-- Row 2: Upper Spine (indented left) -->
      <rect x="148" y="24" width="56" height="13.5" rx="6.75"/>
      <!-- Row 3: Lower Belly (extended right) -->
      <rect x="160" y="48" width="56" height="13.5" rx="6.75"/>
      <!-- Row 4: Bottom Base Bar of S -->
      <rect x="152" y="72" width="64" height="13.5" rx="6.75"/>
    </g>
  </g>

  <!-- WORDMARK: PRECISION LIFE SCIENCES -->
  <g id="Wordmark" transform="translate(305, 40)">
    <!-- "PRECISION" -->
    <text x="0" y="48" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#00205B" letter-spacing="3.5">PRECISION</text>
    
    <!-- "LIFE SCIENCES" -->
    <text x="3" y="86" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#00205B" letter-spacing="11.5">LIFE SCIENCES</text>
  </g>

  <!-- Registered symbol: use only after registration of this exact mark in the relevant jurisdiction -->
  <text x="764" y="56" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#00205B">®</text>
</svg>
