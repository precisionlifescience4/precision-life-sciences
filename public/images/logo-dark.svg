<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="100%">
  <!-- PRECISION LIFE SCIENCES - DARK BACKGROUND LOCKUP -->
  <rect width="100%" height="100%" fill="#00205B" rx="12"/>

  <!-- ICON MARK -->
  <g id="PLS_Emblem" transform="translate(45, 34)">
    <!-- Letter P (White) -->
    <g id="Letter_P" fill="#FFFFFF">
      <rect x="0" y="0" width="64" height="13.5" rx="6.75"/>
      <rect x="0" y="24" width="64" height="13.5" rx="6.75"/>
      <rect x="0" y="48" width="64" height="13.5" rx="6.75"/>
      <circle cx="6.75" cy="78.75" r="6.75"/>
    </g>

    <!-- Letter L (Cyan Sky Blue) -->
    <g id="Letter_L" fill="#00A3E0">
      <rect x="76" y="0" width="13.5" height="13.5" rx="6.75"/>
      <rect x="76" y="24" width="13.5" height="13.5" rx="6.75"/>
      <rect x="76" y="48" width="13.5" height="13.5" rx="6.75"/>
      <rect x="76" y="72" width="64" height="13.5" rx="6.75"/>
    </g>

    <!-- Letter S (White) -->
    <g id="Letter_S" fill="#FFFFFF">
      <rect x="152" y="0" width="64" height="13.5" rx="6.75"/>
      <rect x="148" y="24" width="56" height="13.5" rx="6.75"/>
      <rect x="160" y="48" width="56" height="13.5" rx="6.75"/>
      <rect x="152" y="72" width="64" height="13.5" rx="6.75"/>
    </g>
  </g>

  <!-- WORDMARK (White + Cyan Accents) -->
  <g id="Wordmark" transform="translate(305, 40)">
    <text x="0" y="48" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="3.5">PRECISION</text>
    <text x="3" y="86" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#00A3E0" letter-spacing="11.5">LIFE SCIENCES</text>
  </g>
  <text x="764" y="56" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">®</text>
</svg>
